async function ai(q,ctx){const sys=`أنت FATY، عالم موسوعي ومساعد ذكاء اصطناعي عربي بالغ الدقة، مطوَّر من FATYAK. أنت متمكن في العلوم الشرعية (القرآن وتفسيره وعلومه، السنة وعلوم الحديث، الفقه وأصوله، العقيدة، السيرة والتاريخ الإسلامي) وفي السياسة والاقتصاد والرياضة والطب والعلوم والتقنية والتاريخ والجغرافيا. المستخدم اسمه ${USER}، ناده باسمه أحياناً. تاريخ اليوم: ${today()}.

4) السنة: لا تنسب إلى النبي ﷺ قولاً لا تتيقن من ثبوته. اذكر الراوي والمصدر (البخاري، مسلم، السنن...) ودرجة الحديث، وإن لم تتأكد فبيّن المعنى وقل إنك لا تجزم بثبوت اللفظ. حذّر من الأحاديث الضعيفة والموضوعة المشهورة.
5) الفقه والعقيدة: التزم بما عليه جمهور أهل السنة والجماعة، وانسب الأقوال لأصحابها والمذاهب الأربعة بإنصاف في مسائل الخلاف، ولا تُفتِ في الأحوال الشخصية الخاصة بل انصح بسؤال عالم موثوق. اختم عند الحاجة بـ"والله أعلم".
6) الطب: معلومات علمية دقيقة وتحذيرات الخطر، دون تشخيص ولا وصف جرعات، وانصح بمراجعة الطبيب عند الحاجة.
7) السياسة والاقتصاد والرياضة: حقائق محايدة دون تحيز، والجارية منها من المراجع فقط.
8) التاريخ: ميّز بين المتفق عليه والمختلف فيه، واذكر التواريخ بحذر.
9) الأسلوب: عربية فصحى بسيطة وواضحة جداً، إجابة مباشرة تبدأ بالمطلوب في 3 إلى 6 جمل (أكثر فقط إن لزم)، دون رموز تنسيق كالنجوم والعناوين. في الحديث العادي كن طبيعياً ودوداً وموجزاً.
${ctx?'\nالمراجع:\n'+ctx:'\nلا توجد مراجع لهذا السؤال.'}`;
 const msgs=[{role:'system',content:sys},...hist.slice(-6),{role:'user',content:q}];
 const ok=t=>{t=(t||'').trim();if(t[0]==='{'){try{const j=JSON.parse(t);const c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;return c?c.trim():''}catch(e){return ''}}return t.length>1?t:''};

 const polGet=tmo(fetch('https://text.pollinations.ai/'+encodeURIComponent(q)+'?model=openai&system='+encodeURIComponent(sys.slice(0,1800))).then(async r=>{if(!r.ok)throw 0;const t=ok(await r.text());if(!t)throw 0;return t}),18000);
 const oa=(url,key,model)=>tmo(fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:msgs,temperature:0.3})}).then(async r=>{if(!r.ok)throw 0;const t=ok(await r.text());if(!t)throw 0;return t}),18000);

Rules for "prompt": a single English paragraph, 60-120 words. Keep EVERY detail the user asked for literally (subject, number of objects, colors, clothing, setting, time of day, mood, style, any text). Never replace or omit the main subject; never add unrelated objects or people. Describe the subject first, then composition, camera/lens, lighting, color palette, background, and art style (if none requested, choose the best fitting professional style: photorealistic for real things, clean vector for logos, etc.). End with quality words (masterpiece, ultra detailed, sharp focus, 8k).${lastPrompt?`\nThe user may be refining the previous image. Previous prompt: "${lastPrompt}". If the new message modifies it (change color, add, remove...), apply the change to the previous prompt and keep everything else.`:''}
aspect: landscape for scenes, banners, wallpapers, cinematic; portrait for people full-body, phone wallpapers, posters, stories; otherwise square.`;
 try{const t=await askLLM([{role:'system',content:sysd},{role:'user',content:text}],10000);const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));if(j.prompt&&j.prompt.length>10){en=j.prompt.slice(0,1100);asp=j.aspect||'square'}}catch(e){}
 if(/(افقي|أفقي|عريض|landscape|16:9|سينمائي)/i.test(text))asp='landscape';else if(/(طولي|عمودي|portrait|9:16|ستوري)/i.test(text))asp='portrait';else if(/(مربع|square|1:1)/i.test(text))asp='square';
 const W=asp==='landscape'?1280:asp==='portrait'?768:1024,H=asp==='landscape'?720:asp==='portrait'?1280:1024;

let SUR=null;
async function quran(q){if(!SUR){const j=await (await fetch('https://api.alquran.cloud/v1/surah')).json();SUR=j.data}

async function quranDirect(q){const n=norm(q);let no=null,rg=null;

  if(m)rg=[+m[1],+m[2]];else{const o=n.match(/(?:ايه|اية|آية)\s*(\d{1,3})/);if(o)rg=[+o[1],+o[1]]}}
